         =================================================================== -->
    <g transform="translate(480, 0)">
      <rect width="480" height="270" fill="#1e1e2e" />
      <rect x="20" y="20" width="440" height="228" rx="14" fill="#242538" stroke="#45475a" stroke-width="1" />

