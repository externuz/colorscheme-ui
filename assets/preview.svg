      <text x="310" y="148" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9ece6a">WAI-ARIA</text>
      <rect x="354" y="134" width="86" height="20" rx="5" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.28" stroke-width="1" />
      <text x="397" y="148" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#bb9af7">CSS Modules</text>

