        <rect x="24" y="1" width="18" height="18" rx="4" fill="#8f3f71" stroke="#d5c4a1" stroke-width="1" />
        <rect x="48" y="1" width="18" height="18" rx="4" fill="#427b58" stroke="#d5c4a1" stroke-width="1" />
        <rect x="72" y="1" width="18" height="18" rx="4" fill="#79740e" stroke="#d5c4a1" stroke-width="1" />
        <rect x="96" y="1" width="18" height="18" rx="4" fill="#b57614" stroke="#d5c4a1" stroke-width="1" />
        <rect x="120" y="1" width="18" height="18" rx="4" fill="#af3a03" stroke="#d5c4a1" stroke-width="1" />
        <rect x="144" y="1" width="18" height="18" rx="4" fill="#9d0006" stroke="#d5c4a1" stroke-width="1" />
