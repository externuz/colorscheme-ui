      <rect x="268" y="196" width="80" height="30" rx="6" fill="#24283b" stroke="#3b4261" stroke-width="1" />
      <text x="308" y="215" text-anchor="middle" class="sans" font-size="12" font-weight="500" fill="#c0caf5">Preview</text>
      <rect x="356" y="196" width="84" height="30" rx="6" fill="#7aa2f7" />
      <text x="398" y="215" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#15161e">Active</text>
    </g>

