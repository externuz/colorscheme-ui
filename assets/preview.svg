    <line x1="0" y1="270" x2="960" y2="270" stroke="#3b4261" stroke-opacity="0.55" stroke-width="1" />
    <rect x="0.5" y="0.5" width="959" height="539" rx="13.5" stroke="#3b4261" stroke-opacity="0.7" stroke-width="1" />
