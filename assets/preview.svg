<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-label="colorscheme-ui — 4 built-in editor colorschemes preview">
  <defs>
    <clipPath id="frame-clip">
      <rect width="960" height="540" rx="14" />
    </clipPath>
    <style>
      .sans { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame-clip)">
    <!-- ===================================================================
         1. TOKYO NIGHT (Top-Left: 0, 0)
         =================================================================== -->
    <g transform="translate(0, 0)">
      <rect width="480" height="270" fill="#1a1b26" />
      <rect x="20" y="20" width="440" height="228" rx="14" fill="#1f2335" stroke="#3b4261" stroke-width="1" />

      <!-- Header -->
      <text x="40" y="55" class="mono" font-size="13" font-weight="600">
        <tspan fill="#565f89">:colorscheme </tspan><tspan fill="#c0caf5">tokyo-night</tspan>
      </text>
      <rect x="322" y="39" width="118" height="22" rx="6" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-opacity="0.34" stroke-width="1" />
      <text x="381" y="54" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#7aa2f7">Dark · #7aa2f7</text>

      <!-- Input + Switch -->
      <rect x="40" y="80" width="258" height="34" rx="8" fill="#16161e" stroke="#7aa2f7" stroke-width="1" />
      <text x="52" y="101" class="mono" font-size="11.5">
        <tspan fill="#7aa2f7">&gt; </tspan><tspan fill="#c0caf5">colorscheme-ui/styles.css</tspan>
      </text>

      <rect x="314" y="86" width="38" height="22" rx="11" fill="#7aa2f7" />
      <circle cx="341" cy="97" r="8" fill="#15161e" />
      <text x="360" y="101" class="sans" font-size="12" font-weight="500" fill="#c0caf5">Zero-FOUC</text>

      <!-- Swatches + Semantic Chips -->
      <g transform="translate(40, 134)">
        <rect x="0" y="1" width="18" height="18" rx="4" fill="#7aa2f7" stroke="#3b4261" stroke-width="1" />
        <rect x="24" y="1" width="18" height="18" rx="4" fill="#bb9af7" stroke="#3b4261" stroke-width="1" />
        <rect x="48" y="1" width="18" height="18" rx="4" fill="#7dcfff" stroke="#3b4261" stroke-width="1" />
        <rect x="72" y="1" width="18" height="18" rx="4" fill="#9ece6a" stroke="#3b4261" stroke-width="1" />
        <rect x="96" y="1" width="18" height="18" rx="4" fill="#e0af68" stroke="#3b4261" stroke-width="1" />
        <rect x="120" y="1" width="18" height="18" rx="4" fill="#ff9e64" stroke="#3b4261" stroke-width="1" />
        <rect x="144" y="1" width="18" height="18" rx="4" fill="#f7768e" stroke="#3b4261" stroke-width="1" />
      </g>
