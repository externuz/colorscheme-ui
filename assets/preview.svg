      <text x="52" y="101" class="mono" font-size="11.5">
        <tspan fill="#cba6f7">&gt; </tspan><tspan fill="#cdd6f4">useColorScheme() // hook</tspan>
      </text>

      <rect x="314" y="86" width="38" height="22" rx="11" fill="#cba6f7" />
      <circle cx="341" cy="97" r="8" fill="#11111b" />
      <text x="360" y="101" class="sans" font-size="12" font-weight="500" fill="#cdd6f4">Synced</text>

