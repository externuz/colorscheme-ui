      <rect x="272" y="134" width="76" height="20" rx="5" fill="#427b58" fill-opacity="0.1" stroke="#427b58" stroke-opacity="0.25" stroke-width="1" />
      <text x="310" y="148" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#427b58">React 19</text>
      <rect x="354" y="134" width="86" height="20" rx="5" fill="#8f3f71" fill-opacity="0.1" stroke="#8f3f71" stroke-opacity="0.25" stroke-width="1" />
      <text x="397" y="148" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#8f3f71">Zero Runtime</text>

      <!-- Separator + Footer -->
      <line x1="40" y1="176" x2="440" y2="176" stroke="#e3d5ad" stroke-width="1" />
      <text x="40" y="215" class="mono" font-size="11" fill="#504945">No Tailwind · No CSS-in-JS</text>
      <rect x="268" y="196" width="80" height="30" rx="6" fill="#fcf8e3" stroke="#d5c4a1" stroke-width="1" />
