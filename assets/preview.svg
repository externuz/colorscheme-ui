        <rect x="48" y="1" width="18" height="18" rx="4" fill="#8ec07c" stroke="#504945" stroke-width="1" />
        <rect x="72" y="1" width="18" height="18" rx="4" fill="#b8bb26" stroke="#504945" stroke-width="1" />
        <rect x="96" y="1" width="18" height="18" rx="4" fill="#fabd2f" stroke="#504945" stroke-width="1" />
        <rect x="120" y="1" width="18" height="18" rx="4" fill="#fe8019" stroke="#504945" stroke-width="1" />
        <rect x="144" y="1" width="18" height="18" rx="4" fill="#fb4934" stroke="#504945" stroke-width="1" />
      </g>
