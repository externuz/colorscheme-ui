      <g transform="translate(40, 134)">
        <rect x="0" y="1" width="18" height="18" rx="4" fill="#89b4fa" stroke="#45475a" stroke-width="1" />
        <rect x="24" y="1" width="18" height="18" rx="4" fill="#cba6f7" stroke="#45475a" stroke-width="1" />
        <rect x="48" y="1" width="18" height="18" rx="4" fill="#89dceb" stroke="#45475a" stroke-width="1" />
        <rect x="72" y="1" width="18" height="18" rx="4" fill="#a6e3a1" stroke="#45475a" stroke-width="1" />
        <rect x="96" y="1" width="18" height="18" rx="4" fill="#f9e2af" stroke="#45475a" stroke-width="1" />
        <rect x="120" y="1" width="18" height="18" rx="4" fill="#fab387" stroke="#45475a" stroke-width="1" />
        <rect x="144" y="1" width="18" height="18" rx="4" fill="#f38ba8" stroke="#45475a" stroke-width="1" />
